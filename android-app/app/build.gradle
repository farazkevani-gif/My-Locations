plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mylocations.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mylocations.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        setProperty("archivesBaseName", "MyLocations")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}