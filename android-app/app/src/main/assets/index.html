<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>My Locations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>MY LOCATIONS</h1>
    <div class="header-actions">
      <button id="exportBtn" class="btn-text">Export</button>
      <label class="btn-text" for="importFile">Import</label>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="🔎 Search locations..." autocomplete="off">
  </div>

  <div class="controls-row">
    <div class="filter-tabs">
      <button class="tab-btn active" data-filter="all">All</button>
      <button class="tab-btn" data-filter="favorites">★ Favorites</button>
    </div>
    <select id="sortSelect">
      <option value="name-asc">Name A-Z</option>
      <option value="name-desc">Name Z-A</option>
      <option value="recent-added">Recently Added</option>
      <option value="recent-updated">Recently Updated</option>
      <option value="fav-first">Favorites First</option>
    </select>
  </div>

  <div class="count-bar" id="locationCount">0 Locations</div>

  <main id="locationsList" class="locations-list"></main>

  <button id="addLocationBtn" class="fab">+ Add Location</button>

  <div id="formModal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modalTitle">Add Location</h2>
      <form id="locationForm">
        <input type="hidden" id="locId">
        <label>Name *<input type="text" id="locName" required></label>
        <label>Address<input type="text" id="locAddress"></label>
        <label>Google Maps URL<input type="url" id="locMapsUrl" placeholder="https://maps.google.com/..."></label>
        <div class="coords-row">
          <label>Lat<input type="number" step="any" id="locLat"></label>
          <label>Lng<input type="number" step="any" id="locLng"></label>
        </div>
        <label>Personal Notes<textarea id="locNotes" rows="3"></textarea></label>
        <label class="checkbox-label">
          <input type="checkbox" id="locFavorite"> Mark as Favorite
        </label>
        <div class="modal-buttons">
          <button type="button" id="cancelFormBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="deleteModal" class="modal hidden">
    <div class="modal-content">
      <p>Are you sure you want to delete this location?</p>
      <div class="modal-buttons">
        <button id="cancelDeleteBtn" class="btn-secondary">Cancel</button>
        <button id="confirmDeleteBtn" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
